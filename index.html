<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QitongFlow - 视频反馈工具</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./overrides.css" />
  </head>
  <body>
    <main class="app-shell intro-mode" id="appShell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div class="brand-copy">
            <h1>QitongFlow</h1>
            <p>给剪辑师更清晰的反馈</p>
          </div>
        </div>
        <div class="highlight-note">今天你给 Judy 投票了吗</div>
        <div class="top-actions">
          <button class="button primary" id="downloadPdfButton" type="button">导出给剪辑看</button>
          <button class="button secondary" id="downloadJiaYuanButton" type="button">导出给嘉园</button>
        </div>
      </header>

      <section class="workspace intro" id="workspace">
        <section class="video-locator" id="videoLocator">
          <div class="video-stage video-dropzone" id="videoDropzone">
            <input id="videoInput" type="file" accept="video/*" />
            <div class="video-empty" id="videoEmptyState">
              <label class="video-empty-card" for="videoInput">
                <img class="upload-icon-img" src="./file-upload.svg" alt="" aria-hidden="true" />
                <strong>导入视频</strong>
                <em>拖拽视频到这里，或点击导入</em>
                <small>支持 MP4 / MOV 等常见格式</small>
              </label>
            </div>
            <div class="video-display" id="videoDisplay" hidden>
              <video id="sourceVideo" playsinline></video>
            </div>
          </div>
          <div class="video-tools">
            <div class="player-strip">
              <button class="play-toggle" id="playToggleButton" type="button" aria-label="播放" data-playing="false"></button>
              <span class="strip-time" id="stripCurrentTime">00:00</span>
              <div class="scrubber-wrap">
                <input id="videoScrubber" class="video-scrubber" type="range" min="0" max="1000" value="0" step="1" aria-label="视频进度条" />
                <div class="range-visual" id="rangeVisual" hidden>
                  <div class="range-fill" id="rangeFill"></div>
                  <div class="range-marker start" id="rangeStartMarker"></div>
                  <div class="range-marker end" id="rangeEndMarker"></div>
                  <div class="range-bubble" id="rangeBubble"></div>
                </div>
              </div>
              <span class="strip-time" id="stripDuration">00:00</span>
              <button class="speed-toggle" id="speedToggleButton" type="button">1x</button>
            </div>
            <div class="precise-controls">
              <div class="nudge-actions">
                <button class="button ghost" type="button" data-nudge="-5">后退 5 秒</button>
                <button class="button ghost" type="button" data-nudge="-1">后退 1 秒</button>
                <button class="button ghost" id="setRangeStartButton" type="button">标记开始</button>
                <button class="button ghost" id="setRangeEndButton" type="button">标记结束</button>
                <button class="button ghost nudge-forward" type="button" data-nudge="1">前进 1 秒</button>
                <button class="button ghost nudge-forward" type="button" data-nudge="5">前进 5 秒</button>
              </div>
            </div>
          </div>
        </section>

        <form class="editor-panel" id="entryForm">
          <div class="section-title-row">
            <div class="section-title">录入意见</div>
            <div class="section-tools">
              <label class="button ghost import-project-button" for="importProjectInput">
                <img class="button-icon" src="./download.svg" alt="" aria-hidden="true" />
                <span>导入意见</span>
              </label>
              <input id="importProjectInput" type="file" accept=".json,application/json" />
              <button class="button ghost" id="exportProjectButton" type="button">
                <img class="button-icon" src="./up-right-from-square.svg" alt="" aria-hidden="true" />
                <span>导出意见</span>
              </button>
            </div>
          </div>
          <div class="field time-field">
            <span>时间轴</span>
            <div class="time-input-wrap">
              <input id="timeInput" autocomplete="off" placeholder="当前时间或片段会自动填入" />
              <button class="button primary" id="submitButton" type="submit">添加一条</button>
            </div>
            <small>不填写时间时默认全片</small>
          </div>

          <label class="field note-field">
            <div class="note-heading">
              <div class="note-heading-actions">
                <div class="status-toast" id="statusToast" role="status" aria-live="polite" hidden></div>
              </div>
            </div>
            <textarea id="noteInput" rows="8" placeholder="输入你想修改的地方，例如：这里节奏有点慢，可以剪短一点。"></textarea>
          </label>

          <label class="field type-field" hidden>
            <span>类型</span>
            <select id="typeInput">
              <option value="自动识别">自动识别</option>
              <option value="删除">删除</option>
              <option value="花字 / 包装">花字 / 包装</option>
              <option value="字幕">字幕</option>
              <option value="素材">素材</option>
              <option value="美颜">美颜</option>
              <option value="画面剪辑">画面剪辑</option>
              <option value="结构">结构</option>
              <option value="修改">修改</option>
            </select>
          </label>

          <label class="field">
            <span>参考图（可选）</span>
            <div class="file-picker">
              <label class="file-button" for="referenceImageInput">上传参考图</label>
              <span id="referenceFileName">支持 JPG、PNG 格式</span>
              <input id="referenceImageInput" type="file" accept="image/*" />
            </div>
          </label>
          <div class="reference-preview" id="referencePreview" hidden>
            <img id="referencePreviewImage" alt="参考图预览" />
            <button class="button ghost" id="removeReferenceButton" type="button">删除参考图</button>
          </div>
        </form>

        <section class="list-panel" aria-label="修改意见汇总">
          <div class="panel-heading">
            <h2>修改意见汇总</h2>
            <div class="panel-heading-actions">
              <span id="countLabel">0 条</span>
              <button class="button ghost" id="clearAllButton" type="button">清空</button>
            </div>
          </div>
          <div class="entry-list" id="entryList"></div>
        </section>
      </section>
    </main>

    <div class="duplicate-review" id="duplicateReview" hidden>
      <div class="duplicate-review-card" role="dialog" aria-modal="true" aria-labelledby="duplicateReviewTitle">
        <div class="duplicate-review-head">
          <div>
            <h2 id="duplicateReviewTitle">发现可能重复的意见</h2>
            <p id="duplicateReviewSummary">导入前请确认是否保留。</p>
          </div>
          <button class="duplicate-review-close" id="cancelImportButton" type="button" aria-label="取消导入">×</button>
        </div>
        <div class="duplicate-review-list" id="duplicateReviewList"></div>
        <div class="duplicate-review-actions">
          <button class="button ghost" id="skipDuplicatesButton" type="button">跳过疑似重复</button>
          <button class="button primary" id="importAllButton" type="button">全部导入</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
